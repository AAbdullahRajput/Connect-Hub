name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests
  dio: ^5.4.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.2

  # Image picker
  image_picker: ^1.0.7

  # Socket.io real-time
  socket_io_client: ^2.0.3+1

  # JWT decode
  jwt_decode: ^0.3.1

  # Cached network images
  cached_network_image: ^3.3.1

  # Time ago
  timeago: ^3.6.1

  # Video player
  video_player: ^2.8.3

  # File picker
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/